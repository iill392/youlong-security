<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="YouLong Security Shield banner">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120C"/>
      <stop offset="0.5" stop-color="#0D1A14"/>
      <stop offset="1" stop-color="#0A141F"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="0.5" stop-color="#00C2D1"/>
      <stop offset="1" stop-color="#20E3B2"/>
    </linearGradient>

    <linearGradient id="titleg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0FFF7"/>
      <stop offset="0.6" stop-color="#D8F5E6"/>
      <stop offset="1" stop-color="#8FE8C0"/>
    </linearGradient>

    <linearGradient id="shieldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#00C2D1"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.14" cy="0.9" r="0.8">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.92" cy="0.08" r="0.65">
      <stop offset="0" stop-color="#00C2D1" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#00C2D1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#24352B" stroke-opacity="0.32" stroke-width="1"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask">
      <rect width="900" height="260" fill="url(#fade)"/>
    </mask>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="260" rx="20" fill="url(#bg)"/>
  <rect width="900" height="260" rx="20" fill="url(#glowA)"/>
  <rect width="900" height="260" rx="20" fill="url(#glowB)"/>
  <rect width="900" height="260" rx="20" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect x="1" y="1" width="898" height="258" rx="19" fill="none" stroke="#263530" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="258" rx="19" fill="none" stroke="url(#brand)" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- logo mark: shield + dragon curve -->
  <g>
    <circle cx="110" cy="130" r="58" fill="#3DDC84" fill-opacity="0.14" filter="url(#soft)"/>
    <rect x="42" y="62" width="136" height="136" rx="30" fill="#0F1F18" fill-opacity="0.9" stroke="#2A3B33"/>
    <!-- shield body -->
    <path d="M110 76 L152 92 V128 C152 156 132 174 110 184 C88 174 68 156 68 128 V92 Z"
          fill="#10241B" stroke="url(#shieldg)" stroke-width="3"/>
    <!-- inner dragon curve -->
    <path d="M84 112 C96 96 124 96 132 110 C138 122 128 132 114 130 C102 128 100 118 108 114"
          fill="none" stroke="#3DDC84" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.9"/>
    <circle cx="132" cy="112" r="3.2" fill="#00C2D1"/>
    <!-- check mark inside shield -->
    <path d="M92 142 L104 154 L130 128" fill="none" stroke="#20E3B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="216" text-anchor="middle" font-family="Consolas,'Sarasa Mono SC',monospace" font-size="11" letter-spacing="2.5" fill="#6E8B7C">SECURITY</text>
  </g>

  <!-- title block -->
  <text x="215" y="108" font-family="'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="url(#titleg)">游龙安全护盾</text>

  <text x="217" y="140" font-family="'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" fill="#8BA396">YouLong Security Shield · open-source &amp; free forever · Android security toolkit</text>

  <!-- keyword chips -->
  <g font-family="'Segoe UI','PingFang SC','Noto Sans SC',Helvetica,Arial,sans-serif" font-size="13" font-weight="600">
    <rect x="215" y="160" width="106" height="28" rx="14" fill="#3DDC84" fill-opacity="0.12" stroke="#3DDC84" stroke-opacity="0.5"/>
    <text x="268" y="179" text-anchor="middle" fill="#3DDC84">免 Root 特权</text>

    <rect x="329" y="160" width="106" height="28" rx="14" fill="#00C2D1" fill-opacity="0.12" stroke="#00C2D1" stroke-opacity="0.5"/>
    <text x="382" y="179" text-anchor="middle" fill="#00C2D1">广告拦截</text>

    <rect x="443" y="160" width="118" height="28" rx="14" fill="#20E3B2" fill-opacity="0.12" stroke="#20E3B2" stroke-opacity="0.5"/>
    <text x="502" y="179" text-anchor="middle" fill="#20E3B2">应用风险治理</text>

    <rect x="569" y="160" width="96" height="28" rx="14" fill="#7F52FF" fill-opacity="0.14" stroke="#7F52FF" stroke-opacity="0.5"/>
    <text x="617" y="179" text-anchor="middle" fill="#A78BFA">紧急逃生</text>

    <rect x="673" y="160" width="112" height="28" rx="14" fill="#FF6B6B" fill-opacity="0.10" stroke="#FF6B6B" stroke-opacity="0.45"/>
    <text x="729" y="179" text-anchor="middle" fill="#FF8A8A">实时守护</text>
  </g>

  <!-- bottom accent -->
  <rect x="215" y="210" width="430" height="4" rx="2" fill="url(#brand)"/>
  <text x="215" y="238" font-family="Consolas,'Sarasa Mono SC',monospace" font-size="12" fill="#6E8B7C">Java · Kotlin · NDK/C++ · WebView SPA · Stellar 内核源码级内置</text>

  <!-- right side decoration: data stream + phone -->
  <g stroke-linecap="round">
    <g transform="translate(830,84)" fill="none" stroke-width="1.8">
      <path d="M0 46 L14 46" stroke="#3DDC84" stroke-opacity="0.75"/>
      <path d="M0 60 L30 60" stroke="#00C2D1" stroke-opacity="0.6"/>
      <path d="M0 74 L20 74" stroke="#20E3B2" stroke-opacity="0.5"/>
      <path d="M0 88 L38 88" stroke="#3DDC84" stroke-opacity="0.35"/>
      <path d="M0 102 L24 102" stroke="#00C2D1" stroke-opacity="0.3"/>
    </g>
    <g transform="translate(806,60)" opacity="0.85">
      <rect x="0" y="0" width="58" height="118" rx="12" fill="#0F1F18" fill-opacity="0.85" stroke="#2A3B33"/>
      <rect x="10" y="14" width="38" height="8" rx="4" fill="#3DDC84" fill-opacity="0.55"/>
      <rect x="10" y="30" width="30" height="6" rx="3" fill="#00C2D1" fill-opacity="0.5"/>
      <rect x="10" y="44" width="36" height="6" rx="3" fill="#20E3B2" fill-opacity="0.4"/>
      <rect x="10" y="58" width="26" height="6" rx="3" fill="#3DDC84" fill-opacity="0.3"/>
      <rect x="10" y="86" width="38" height="20" rx="6" fill="#00C2D1" fill-opacity="0.16" stroke="#00C2D1" stroke-opacity="0.45"/>
    </g>
  </g>
</svg>
