// ==========================================================================
// :shared —— 共享常量（roro.stellar.StellarApiConstants、BinderContainer 协议）
// --------------------------------------------------------------------------
// 源码来自 https://github.com/roro2239/Stellar-API （MPL-2.0 + Apache-2.0）。
//
// 本文件是**本工程适配版**，不是上游原文件：
//   · 删除上游的 `apply from: file('../publish.gradle')`（本工程源码内置，不发布）；
//   · compileSdk / minSdk / Java 版本统一由根 build.gradle 的 subprojects 块注入；
//   · 其余（namespace、BuildConfig 字段、依赖）与上游一致。
// ==========================================================================
plugins {
    id('com.android.library')
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'roro.stellar.shared'
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        buildConfigField 'int', 'SERVER_API_VERSION', "${rootProject.ext.api_version_code}"
        buildConfigField 'String', 'SERVER_API_VERSION_NAME', "\"${rootProject.ext.api_version_name}\""
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin {
        jvmToolchain(21)
    }
}

dependencies {
    implementation project(':aidl')

    implementation apiLibs.androidxAnnotation
}
