// ==========================================================================
// :provider —— StellarProvider（ContentProvider，接收特权服务端下发的 Binder）
// --------------------------------------------------------------------------
// 源码来自 https://github.com/roro2239/Stellar-API （MPL-2.0 + Apache-2.0）。
//
// 本文件是**本工程适配版**，不是上游原文件：
//   · 删除上游的 `apply from: file('../publish.gradle')`（本工程源码内置，不发布）；
//   · compileSdk / minSdk / Java 版本统一由根 build.gradle 的 subprojects 块注入；
//   · 其余（namespace、consumer-rules）与上游一致。
// ==========================================================================
plugins {
    id('com.android.library')
    id('org.jetbrains.kotlin.android')
}

android {
    namespace 'roro.stellar.provider'
    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }
    buildFeatures {
        buildConfig false
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin {
        jvmToolchain(21)
    }
}

dependencies {
    implementation project(':api')

    implementation apiLibs.androidxAnnotation
    implementation apiLibs.coreKtx
}
