// ==========================================================================
// :shizuku-api —— Stellar 内置的 Shizuku 兼容层客户端
// --------------------------------------------------------------------------
// 源码来自 https://github.com/roro2239/Stellar （MPL-2.0 + Apache-2.0）。
// 含 ShizukuProvider / ShizukuCompat 与 rikka.rish（rish 终端客户端）。
//
// 本文件是**本工程适配版**，不是上游原文件：
//   · compileSdk / minSdk / Java 版本统一由根 build.gradle 的 subprojects 块注入；
//   · 其余（namespace、consumer-rules、依赖）与上游一致。
// ==========================================================================
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'roro.stellar.shizuku'
    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }
    buildFeatures {
        buildConfig = false
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    kotlin {
        jvmToolchain(21)
    }
}

dependencies {
    api project(':shizuku-aidl')

    implementation serverLibs.androidxAnnotation
}
