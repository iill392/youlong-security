# ==========================================================================
# Gradle / Android 构建属性
# --------------------------------------------------------------------------
# ⚠️ 2026 年迁移（内置内核由 Shizuku 换成 Stellar）后，原来的
#    android.nonTransitiveRClass=false 已不再需要：那条是为了让移植过来的
#    Shizuku 管理器能引用依赖库自身的资源；内置 Stellar 的 manager 是完整的
#    Compose 应用模块，不再依赖该兼容开关。
#    同时 android.enableJetifier 也已去掉 —— 现代 AndroidX 依赖无需 jetifier，
#    开着它会在 AGP 8.13 下拖慢构建并对 Stellar 的新版依赖产生意外改写。
# ==========================================================================

# --------------------------------------------------------------------------
# ⚠️ 工程路径必须是纯 ASCII —— 否则 AIDL 编译必然失败
# --------------------------------------------------------------------------
# 本工程原先位于 E:\安全护盾\anquan。该路径含中文，会让 AIDL 编译任务直接失败：
#
#   Execution failed for task ':aidl:compileDebugAidl'.
#     > java.nio.charset.MalformedInputException: Input length = 1
#       at com.android.builder.internal.incremental.DependencyData
#            .processDependencyData(DependencyData.java:118)
#       at com.android.build.gradle.tasks.AidlCompile$DepFileProcessor
#            .processFile(AidlCompile.kt:116)
#
# 根因（已逐层验证）：
#   · aidl.exe 编译完会把「输入 .aidl 文件的绝对路径」写进依赖文件 *.d，
#     而 Windows 版 aidl.exe 按**系统 ANSI 代码页（GBK）**写这个文件，
#     于是路径里的中文以 GBK 字节落盘（实测 "安全护盾" = B0 B2 C8 AB BB A4 B6 DC）；
#   · AGP 用 Files.readAllLines(path) 读回，该方法在 JDK 18+ 上
#     **固定按 UTF-8 解码**：实测即使把 -Dfile.encoding 设成 GBK、
#     Charset.defaultCharset() 返回 GBK，Files.readAllLines() 依然抛
#     MalformedInputException（已用最小 Java 程序单独复现）。
#
# 因此没有任何 Gradle / JVM 参数可以绕过，唯一可靠做法是让工程路径不含非 ASCII
# 字符。本工程已从 E:\安全护盾\anquan 迁移到 **E:\anquan**。
#
# 旁证：把 AIDL 源与产物都放到纯 ASCII 路径直接调用 aidl.exe 是通过的；
#      只有「.aidl 源文件路径含中文」时才失败。
# --------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:/tmp
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableR8.fullMode=true
android.overridePathCheck=true

# AGP 8.13.2 官方支持到 compileSdk 36.1；Stellar 需要 37（用到 API 37 的
# ACCESS_LOCAL_NETWORK / USE_LOOPBACK_INTERFACE），这里显式压掉「未测试」警告。
android.suppressUnsupportedCompileSdk=37
