def prefabRoot = new File(project.projectDir, '.prefab')
def stellarLibcxxPrefabDir = new File(prefabRoot, 'libcxx')
def stellarBoringsslPrefabDir = new File(prefabRoot, 'boringssl')

tasks.register('extractPrefabPackages') {
    description = '把 libcxx / boringssl 的 prefab 内容解压到 buildDir/prefab（替代 AGP prefab）'
    group = 'build'

    
    
    def cfg = configurations.detachedConfiguration(
            dependencies.create('org.lsposed.libcxx:libcxx:27.0.12077973'),
            dependencies.create('io.github.vvb2060.ndk:boringssl:20250114'))

    inputs.files(cfg)
    outputs.dir(prefabRoot)

    doLast {
        prefabRoot.deleteDir()
        stellarLibcxxPrefabDir.mkdirs()
        stellarBoringsslPrefabDir.mkdirs()

        def targets = [
                (stellarLibcxxPrefabDir)   : 'libcxx-',
                (stellarBoringsslPrefabDir): 'boringssl-'
        ]
        cfg.files.each { aar ->
            targets.each { dir, prefix ->
                if (aar.name.startsWith(prefix)) {
                    
                    
                    
                    
                    
                    new java.util.zip.ZipInputStream(new java.io.FileInputStream(aar)).withCloseable { zis ->
                        def entry
                        while ((entry = zis.nextEntry) != null) {
                            def name = entry.name
                            if (!entry.isDirectory() && name.startsWith('prefab/')) {
                                def rel = name.substring('prefab/'.length())
                                if (rel) {
                                    def out = new File(dir, rel)
                                    out.parentFile.mkdirs()
                                    out.withOutputStream { os -> zis.transferTo(os) }
                                }
                            }
                            zis.closeEntry()
                        }
                    }
                }
            }
        }

        
        def checks = [
                new File(stellarLibcxxPrefabDir, 'modules/cxx/include/vector'),
                new File(stellarLibcxxPrefabDir, 'modules/cxx/libs/android.arm64-v8a/libcxx.a'),
                new File(stellarBoringsslPrefabDir, 'modules/crypto_static/include/openssl/aead.h'),
                new File(stellarBoringsslPrefabDir, 'modules/crypto_static/libs/android.arm64-v8a/libcrypto_static.a')
        ]
        checks.each { c ->
            if (!c.exists()) {
                throw new GradleException("prefab 解压不完整，缺少：${c}")
            }
        }
        println "prefab 已解压到：${prefabRoot}"
    }
}


