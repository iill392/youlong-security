tasks.configureEach { t ->
    if (t.name.startsWith('configureCMake')
            || t.name.startsWith('buildCMake')
            || t.name.startsWith('externalNativeBuildClean')) {
        t.dependsOn 'extractPrefabPackages'
    }
}

