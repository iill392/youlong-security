def hardeningDir = rootProject.file('hardening')
def dictRulesFile = new File(buildDir, 'hardening/obfuscation-dict.pro')
if (hardeningDir.exists()) {
    dictRulesFile.parentFile.mkdirs()
    def memberDict = new File(hardeningDir, 'member-dict.txt').absolutePath.replace('\\', '/')
    def classDict = new File(hardeningDir, 'class-dict.txt').absolutePath.replace('\\', '/')
    dictRulesFile.text = """\
# 自动生成，请勿手改（由 app/build.gradle 生成）
-obfuscationdictionary '${memberDict}'
-classobfuscationdictionary '${classDict}'
"""
}

android {
    namespace 'com.youlong.hd'
    compileSdk 37
    
    
    
    ndkVersion "29.0.13113456"

    defaultConfig {
        applicationId "com.youlong.hd"
        minSdk 24
        targetSdk 37
        versionCode rootProject.ext.versionCode
        versionName "9.1.1"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        
        
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11'
                
                
                
                
                
                //
                
                
                arguments '-DANDROID_STL=none',
                        "-DSTELLAR_LIBCXX_PREFAB_DIR=${stellarLibcxxPrefabDir}",
                        "-DSTELLAR_BORINGSSL_PREFAB_DIR=${stellarBoringsslPrefabDir}"
            }
        }
    }

    
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // ========================================================================
    
    // ------------------------------------------------------------------------
    
    
    
    
    //
    
    
    
    
    
    //
    
    
    // ========================================================================

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', dictRulesFile
            
            
            ndk {
                debugSymbolLevel 'none'
            }
        }
        debug {
            // debug 关闭 R8/shrink：保留日志与断点行号，加快构建（2026-10 审查修复）
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
        }
    }

    // ======================================================================
    
    // ----------------------------------------------------------------------
    
    
    
    
    
    
    
    
    
    
    
    
    
    // ======================================================================
    aaptOptions {
        noCompress 'dex'
    }

    // ======================================================================
    
    // ----------------------------------------------------------------------
    
    
    
    
    
    
    // ======================================================================
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        
        
        
        
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        
        
        encoding 'UTF-8'
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        compose = true
        
        
        
        
        //        Error while executing process ...\prefab_command.bat
        
        
        
        
        
        
        prefab = false
    }

    lint {
        
        
        
        
        baseline = file('lint-baseline.xml')
        checkReleaseBuilds false
    }

    
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildType = variant.buildType.name
            output.outputFileName = "app-${buildType}-${new Date().format('yyyyMMdd-HHmmss')}.apk"
        }
    }
}

