// ==========================================================================

// --------------------------------------------------------------------------


//

//      AGP        8.2.2  → 8.13.2
//      Kotlin     2.0.0  → 2.2.0




//



// ==========================================================================

plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.0' apply false

    
    id 'com.google.devtools.ksp' version '2.2.0-2.0.2' apply false

    
    
    
    
    //
    
    
    
    
    
    id 'dev.rikka.tools.refine' version '4.4.0' apply false
    id 'dev.rikka.tools.materialthemebuilder' version '1.5.1' apply false
}

// ==========================================================================

// --------------------------------------------------------------------------



//


//        "this and base files have different roots"

//        java.lang.IllegalArgumentException: this and base files have different roots

// ==========================================================================
gradle.beforeProject { project ->
    if (project == rootProject) {
        return
    }
    project.layout.buildDirectory.set(
            new File(project.rootDir, "build_out/${project.path.replace(':', '_')}"))
}

// ==========================================================================

// --------------------------------------------------------------------------



// ==========================================================================
ext {
    api_version_major = 1
    api_version_minor = 0
    api_version_patch = 3
    api_version_name = "${api_version_major}.${api_version_minor}.${api_version_patch}"
    api_version_code = api_version_major * 100 + api_version_minor * 10 + api_version_patch

    
    
    
    versionCode = 1234567929
    versionName = "9.1.1"
}

// ==========================================================================

// --------------------------------------------------------------------------

//     subprojects { plugins.withId("com.android.base") { android { ... } } }


//





// ==========================================================================
subprojects { sub ->
    if (sub.name == 'app') {
        return
    }
    sub.plugins.withId('com.android.base') {
        sub.android {
            compileSdk 37
            defaultConfig {
                minSdk 24
                targetSdk 37
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_21
                targetCompatibility JavaVersion.VERSION_21
                
                
                
                
                encoding 'UTF-8'
            }
            lint {
                checkReleaseBuilds false
                abortOnError false
            }
        }

        // ------------------------------------------------------------------
        
        // ------------------------------------------------------------------
        
        
        
        sub.plugins.withId('org.jetbrains.kotlin.android') {
            sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                it.kotlinOptions.jvmTarget = '21'
            }
        }
    }
}
